<!DOCTYPE html>
<!-- Shaikha Alhajri - 418008663 -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Patients</title>

    <!-- Bootstrap 5 CSS - for styling and responsiveness -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Shared CSS file -->
    <link href="styles.css" rel="stylesheet">

    <!-- Bootstrap 5 JS - needed for interactive components -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- jQuery - for DOM manipulation and easier API calls -->
    <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
</head>
<body>
<div class="container mt-4">

    <h1>Patients</h1>

    <div class="d-flex mb-3">
        <input type="text" id="searchInput" class="form-control me-2" placeholder="Search by last name...">
        <button class="btn me-2" onclick="searchPatients()">Search</button>
        <button class="btn" onclick="showAddForm()">Add Patient</button>
    </div>

    <table class="table table-bordered table-hover" id="patientTable">
        <thead class="table-header">
        <tr>
            <th>Emirates ID</th>
            <th>First Name</th>
            <th>Last Name</th>
            <th>Ethnicity</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody id="patientTableBody">
        </tbody>
    </table>

    <form id="patientForm" style="display:none;" class="mt-3">
        <h4>Patient Form</h4>

        <!-- hidden id so we know if this is edit mode -->
        <input type="hidden" id="patientId">

        <div class="mb-3">
            <label>First Name</label>
            <input type="text" id="patientFirstName" class="form-control" placeholder="Enter first name">
        </div>

        <div class="mb-3">
            <label>Last Name</label>
            <input type="text" id="patientLastName" class="form-control" placeholder="Enter last name">
        </div>

        <div class="mb-3">
            <label>Ethnicity</label>
            <input type="text" id="patientEthnicity" class="form-control" placeholder="Enter ethnicity">
        </div>

        <button type="button" class="btn" onclick="savePatient()">Save</button>
        <button type="button" class="btn" onclick="hideForm()">Cancel</button>
    </form>

</div>

<script>
    // load all rows on first page render
    $(document).ready(function() {
        loadPatients();
    });

    // get all patients
    function loadPatients() {
        fetch("/api/patients")
            .then(function(response) { return response.json(); })
            .then(function(patients) {
                $("#patientTableBody").empty();
                for (let patient of patients) {
                    addRowToTable(patient);
                }
            });
    }

    // render one table row
    function addRowToTable(patient) {
        let row = $("<tr>");

        row.append($("<td>").text(patient.emiratesID));
        row.append($("<td>").text(patient.firstName));
        row.append($("<td>").text(patient.lastName));
        row.append($("<td>").text(patient.ethnicity));

        let actions = $("<td>");

        let editBtn = $("<button>")
            .text("Edit")
            .addClass("btn btn-sm me-2")
            .click(function() { showEditForm(patient); });

        let deleteBtn = $("<button>")
            .text("Delete")
            .addClass("btn btn-sm")
            .click(function() { deletePatient(patient.emiratesID); });

        actions.append(editBtn);
        actions.append(deleteBtn);
        row.append(actions);

        $("#patientTableBody").append(row);
    }

    // open empty add form
    function showAddForm() {
        document.getElementById("patientForm").reset();
        $("#patientId").val("");
        $("#patientForm").show();
    }

    // open edit form with row values
    function showEditForm(patient) {
        $("#patientId").val(patient.emiratesID);
        $("#patientFirstName").val(patient.firstName);
        $("#patientLastName").val(patient.lastName);
        $("#patientEthnicity").val(patient.ethnicity);
        $("#patientForm").show();
    }

    // close form
    function hideForm() {
        $("#patientForm").hide();
        document.getElementById("patientForm").reset();
    }

    // save add/edit
    function savePatient() {
        let id = $("#patientId").val();
        let patient = {
            firstName: $("#patientFirstName").val(),
            lastName: $("#patientLastName").val(),
            ethnicity: $("#patientEthnicity").val()
        };

        if (id) {
            fetch("/api/patients/" + id, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(patient)
            })
                .then(function(response) { return response.json(); })
                .then(function() {
                    hideForm();
                    loadPatients();
                });
        } else {
            fetch("/api/patients", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(patient)
            })
                .then(function(response) { return response.json(); })
                .then(function() {
                    hideForm();
                    loadPatients();
                });
        }
    }

    // delete by patient id
    function deletePatient(id) {
        if (confirm("Are you sure you want to delete this patient?")) {
            fetch("/api/patients/" + id, {
                method: "DELETE"
            }).then(function() {
                loadPatients();
            });
        }
    }

    // search by last name
    function searchPatients() {
        let lastName = $("#searchInput").val().trim();

        if (lastName === "") {
            loadPatients();
            return;
        }

        fetch("/api/patients/search?lastName=" + encodeURIComponent(lastName))
            .then(function(response) { return response.json(); })
            .then(function(patients) {
                $("#patientTableBody").empty();
                for (let patient of patients) {
                    addRowToTable(patient);
                }
            });
    }
</script>

</body>
</html>
