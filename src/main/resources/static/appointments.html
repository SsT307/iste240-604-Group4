<!DOCTYPE html>
<!-- Shaikha Alhajri - 418008663 -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedPRO - Appointments</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- App shell -->
<div class="app-shell">
    <!-- Sidebar -->
    <!-- Sidebar navigation -->
    <aside class="sidebar">
        <div class="sidebar-logo">
            <a href="index.html" class="logo-link">
                <img src="medPro_logo1.png" alt="MedPRO" class="logo-icon"/>
                <span class="sidebar-logo-text">MedPRO</span>
            </a>
        </div>

        <!-- Sidebar links -->
        <nav class="sidebar-nav">
            <a href="index.html" class="nav-item active">DASHBOARD</a>
            <a href="calendar.html" class="nav-item">CALENDAR</a>
            <a href="specialists.html" class="nav-item">DOCTORS</a>
            <a href="reports.html" class="nav-item">MEDICAL RECORDS</a>
        </nav>

    </aside>

    <!-- Main content -->
    <!-- Main page content -->
    <main class="main-content">
        <a href="index.html" class="back-link">← Back to Dashboard</a>

        <div class="page-header">
            <h1 class="page-title">Appointments</h1>
        </div>

        <div class="entity-page-wrap">
            <!-- Search and action controls -->
            <div class="entity-toolbar">
                <input type="number" id="searchInput" class="form-input entity-search" placeholder="Search by appointment ID...">
                <button class="btn-action secondary" id="searchBtn" type="button">Search</button>
                <button class="btn-action ghost" id="viewAllBtn" type="button">View All</button>
                <button class="btn-action primary" id="addBtn" type="button">Add Appointment</button>
            </div>

            <!-- Data table section -->
            <div class="table-card">
                <div class="table-scroll">
                    <table class="data-table">
                        <thead>
                        <tr>
                            <th>Appointment ID</th>
                            <th>Date</th>
                            <th>Time</th>
                            <th>Reason</th>
                            <th>Patient ID</th>
                            <th>Doctor ID</th>
                            <th>Hospital ID</th>
                            <th>Actions</th>
                        </tr>
                        </thead>
                        <tbody id="appointmentTableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
</div>

<!-- Footer -->
<!-- Footer section -->
<footer class="app-footer">
    <span class="footer-copy">&copy; 2026 MedPRO. All rights reserved.</span>
    <div class="footer-links">
        <a href="#">Privacy Policy</a>
        <a href="#">Terms of Use</a>
        <a href="#">Support</a>
    </div>
</footer>

<!-- Add / update appointment modal -->
<!-- Modal form for add and update -->
<div class="modal-overlay" id="appointmentModal">
    <div class="modal-card">
        <h3 class="modal-title" id="appointmentModalTitle">Add Appointment</h3>

        <input type="hidden" id="appointmentId">

        <div class="form-grid">
            <div class="form-group-field">
                <label class="form-label" for="appointmentDate">Date</label>
                <input type="date" id="appointmentDate" class="form-input">
            </div>
            <div class="form-group-field">
                <label class="form-label" for="appointmentTime">Time</label>
                <input type="time" id="appointmentTime" class="form-input">
            </div>
            <div class="form-group-field full-width">
                <label class="form-label" for="appointmentReason">Reason</label>
                <input type="text" id="appointmentReason" class="form-input" placeholder="Enter reason">
            </div>
            <div class="form-group-field">
                <label class="form-label" for="appointmentPatientID">Patient ID</label>
                <input type="number" id="appointmentPatientID" class="form-input" placeholder="Enter Patient ID">
            </div>
            <div class="form-group-field">
                <label class="form-label" for="appointmentDoctorID">Doctor ID</label>
                <input type="number" id="appointmentDoctorID" class="form-input" placeholder="Enter doctor ID">
            </div>
            <div class="form-group-field full-width">
                <label class="form-label" for="appointmentHospitalID">Hospital ID</label>
                <input type="number" id="appointmentHospitalID" class="form-input" placeholder="Enter hospital ID">
            </div>
        </div>

        <div class="modal-actions">
            <button class="btn-action ghost" id="cancelBtn" type="button">Cancel</button>
            <button class="btn-action primary" id="saveBtn" type="button">Save</button>
        </div>
    </div>
</div>

<!-- Shared UI utilities -->
<script src="shared-ui.js"></script>
<script>
    // Get references for appointments table and search input
    const tableBody = document.getElementById("appointmentTableBody");
    const searchInput = document.getElementById("searchInput");
    const appointmentModalTitle = document.getElementById("appointmentModalTitle");

    // Get references for appointment form fields
    const appointmentId = document.getElementById("appointmentId");
    const appointmentDate = document.getElementById("appointmentDate");
    const appointmentTime = document.getElementById("appointmentTime");
    const appointmentReason = document.getElementById("appointmentReason");
    const appointmentPatientID = document.getElementById("appointmentPatientID");
    const appointmentDoctorID = document.getElementById("appointmentDoctorID");
    const appointmentHospitalID = document.getElementById("appointmentHospitalID");

    let appointmentsCache = [];

    // Register click handlers for page buttons
    document.getElementById("addBtn").addEventListener("click", openAddModal);
    document.getElementById("searchBtn").addEventListener("click", searchAppointment);
    document.getElementById("viewAllBtn").addEventListener("click", loadAppointments);
    document.getElementById("cancelBtn").addEventListener("click", function () {
        MedProUI.closeModal("appointmentModal");
    });
    document.getElementById("saveBtn").addEventListener("click", saveAppointment);

    // Allow modal close when user clicks outside modal card
    MedProUI.wireOverlayClose("appointmentModal");

    // This function loads all appointments from the API
    // It refreshes table data with current records
    async function loadAppointments() {
        try {
            const response = await fetch("/api/appointments");
            const appointments = await response.json();
            renderRows(appointments);
        } catch (error) {
            MedProUI.showToast("Could not load appointments.", "error");
        }
    }

    // This function renders appointment rows in the table
    // It shows a message if no records are available
    function renderRows(appointments) {
        appointmentsCache = Array.isArray(appointments) ? appointments : [];

        if (appointmentsCache.length === 0) {
            tableBody.innerHTML = '<tr><td colspan="8" class="empty-state">No appointments found.</td></tr>';
            return;
        }

        tableBody.innerHTML = appointmentsCache.map(function (appointment) {
            return `<tr>
                <td>${appointment.appointmentID ?? ""}</td>
                <td>${MedProUI.sanitize(appointment.date)}</td>
                <td>${MedProUI.sanitize(appointment.time)}</td>
                <td>${MedProUI.sanitize(appointment.reason)}</td>
                <td>${appointment.patientID ?? ""}</td>
                <td>${appointment.doctorID ?? ""}</td>
                <td>${appointment.hospitalID ?? ""}</td>
                <td>
                    <div class="row-actions">
                        <button class="btn-row edit" type="button" onclick="openEditModal(${appointment.appointmentID})">Edit</button>
                        <button class="btn-row delete" type="button" onclick="deleteAppointment(${appointment.appointmentID})">Delete</button>
                    </div>
                </td>
            </tr>`;
        }).join("");
    }

    // This function clears all modal input fields
    function resetForm() {
        appointmentId.value = "";
        appointmentDate.value = "";
        appointmentTime.value = "";
        appointmentReason.value = "";
        appointmentPatientID.value = "";
        appointmentDoctorID.value = "";
        appointmentHospitalID.value = "";
    }

    // This runs when user clicks Add Appointment
    // It opens the modal in add mode
    function openAddModal() {
        resetForm();
        appointmentModalTitle.textContent = "Add Appointment";
        MedProUI.openModal("appointmentModal");
    }

    // This runs when user clicks edit in a row
    // It fills modal fields with selected appointment data
    window.openEditModal = function (id) {
        const appointment = appointmentsCache.find(function (item) { return item.appointmentID === id; });
        if (!appointment) {
            MedProUI.showToast("Could not open selected appointment.", "error");
            return;
        }

        appointmentModalTitle.textContent = "Update Appointment";
        appointmentId.value = appointment.appointmentID ?? "";
        appointmentDate.value = String(appointment.date || "").slice(0, 10);
        appointmentTime.value = String(appointment.time || "").slice(0, 5);
        appointmentReason.value = appointment.reason ?? "";
        appointmentPatientID.value = appointment.patientID ?? "";
        appointmentDoctorID.value = appointment.doctorID ?? "";
        appointmentHospitalID.value = appointment.hospitalID ?? "";
        MedProUI.openModal("appointmentModal");
    };

    // This function saves new or updated appointment data
    // It sends POST for add and PUT for update
    async function saveAppointment() {
        const id = appointmentId.value.trim();
        const payload = {
            date: appointmentDate.value,
            time: appointmentTime.value,
            reason: appointmentReason.value.trim(),
            patientID: Number(appointmentPatientID.value),
            doctorID: Number(appointmentDoctorID.value),
            hospitalID: Number(appointmentHospitalID.value)
        };

        if (!payload.date || !payload.time || !payload.reason || !payload.patientID || !payload.doctorID || !payload.hospitalID) {
            MedProUI.showToast("Please complete all appointment fields.", "error");
            return;
        }

        if (id) {
            payload.appointmentID = Number(id);
        }

        const url = id ? `/api/appointments/${id}` : "/api/appointments";
        const method = id ? "PUT" : "POST";

        try {
            const response = await fetch(url, {
                method,
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });

            if (!response.ok) {
                throw new Error("Save failed");
            }

            MedProUI.closeModal("appointmentModal");
            MedProUI.showToast(id ? "Appointment updated." : "Appointment added.");
            loadAppointments();
        } catch (error) {
            MedProUI.showToast("Unable to save appointment.", "error");
        }
    }

    // This function deletes one appointment by ID
    // It asks for confirmation before API delete call
    window.deleteAppointment = async function (id) {
        if (!confirm("Delete this appointment?")) {
            return;
        }

        try {
            const response = await fetch(`/api/appointments/${id}`, { method: "DELETE" });
            if (!response.ok) {
                throw new Error("Delete failed");
            }
            MedProUI.showToast("Appointment deleted.");
            loadAppointments();
        } catch (error) {
            MedProUI.showToast("Unable to delete appointment.", "error");
        }
    };

    // This function searches one appointment by ID
    // If search input is empty, it reloads all rows
    async function searchAppointment() {
        const id = searchInput.value.trim();
        if (!id) {
            loadAppointments();
            return;
        }

        try {
            const response = await fetch(`/api/appointments/${encodeURIComponent(id)}`);
            if (!response.ok) {
                throw new Error("Not found");
            }
            const appointment = await response.json();
            renderRows(appointment && appointment.appointmentID ? [appointment] : []);
        } catch (error) {
            renderRows([]);
            MedProUI.showToast("No appointment found for that ID.", "error");
        }
    }

    // Initial table load when page opens
    loadAppointments();
</script>

</body>
</html>
