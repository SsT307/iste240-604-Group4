<!DOCTYPE html>
<!--Tania Aziz - 418005117-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hospitals</title>

    <!-- Bootstrap 5 CSS - for styling and responsiveness -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Shared CSS file -->
    <link href="style.css" rel="stylesheet">

    <!-- Bootstrap 5 JS - needed for interactive components like modals -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- jQuery - for DOM manipulation and making API calls easier -->
    <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>

    <!-- Shared JS file -->
    <script src="script.js"></script>
</head>
<body>
<!-- BODY CONTENT -->
<!-- main container - centers content and adds padding -->
<div class="container mt-4">

    <!-- page title -->
    <h1>Hospitals</h1>

    <!-- top bar with search and add button -->
    <div class="d-flex mb-3">

        <!-- search bar -->
        <input type="text" id="searchInput" class="form-control me-2" placeholder="Search by name...">

        <!-- search button -->
        <button class="btn me-2" onclick="searchHospitals()">Search</button>

        <!-- add new hospital button -->
        <button class="btn" onclick="showAddForm()">Add Hospital</button>
    </div>

    <!-- TABLE to display all hospitals -->
    <table class="table table-bordered table-hover" id="hospitalTable">
        <thead class="table-header">
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Owner</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody id="hospitalTableBody">
        <!-- rows will be added here dynamically by JavaScript -->
        </tbody>
    </table>

    <!-- FORM for adding/editing a hospital - hidden by default -->
    <form id="hospitalForm" style="display:none;" class="mt-3">
        <h4>Hospital Form</h4>

        <!-- hidden field to store the ID when editing -->
        <input type="hidden" id="hospitalId">

        <div class="mb-3">
            <label>Name</label>
            <input type="text" id="hospitalName" class="form-control" placeholder="Enter hospital name">
        </div>

        <div class="mb-3">
            <label>Owner</label>
            <input type="text" id="hospitalOwner" class="form-control" placeholder="Enter owner">
        </div>

        <button type="button" class="btn" onclick="saveHospital()">Save</button>
        <button type="button" class="btn" onclick="hideForm()">Cancel</button>
    </form>

</div>

<!-- JAVASCRIPT CONTENT -->
<!-- JS for hospital CRUD operations will go here -->
<script>
    // when page is ready, load all hospitals
    $(document).ready(function() {
        loadHospitals();
    });

    // FUNCTION 1: GET all hospitals from API and display in table
    function loadHospitals() {
        fetch("/api/hospitals")
            .then(function(response) {
                return response.json();
            })
            .then(function(hospitals) {
                // clear the table before adding new rows - prevents duplicates
                $("#hospitalTableBody").empty();

                // loop through each hospital and add a row to the table
                for (let hospital of hospitals) {
                    addRowToTable(hospital);
                }
            });
    }

    // FUNCTION 2: creates and adds one row to the table for a hospital object
    function addRowToTable(hospital) {
        let row = $("<tr>");

        // add data cells
        row.append($("<td>").text(hospital.hospitalID));
        row.append($("<td>").text(hospital.name));
        row.append($("<td>").text(hospital.owner));

        // add edit and delete buttons in the last cell
        let actions = $("<td>");

        let editBtn = $("<button>")
            .text("Edit")
            .addClass("btn btn-sm me-2")
            .click(function() { showEditForm(hospital); });

        let deleteBtn = $("<button>")
            .text("Delete")
            .addClass("btn btn-sm")
            .click(function() { deleteHospital(hospital.hospitalID); });

        actions.append(editBtn);
        actions.append(deleteBtn);
        row.append(actions);

        $("#hospitalTableBody").append(row);
    }

    // FUNCTION 3: shows the empty form for adding a new hospital
    function showAddForm() {
        // clear all form fields at once
        document.getElementById("hospitalForm").reset();
        // show the form
        $("#hospitalForm").show();
    }

    // FUNCTION 4: shows the form filled with existing data for editing
    function showEditForm(hospital) {
        // fill the form with the hospital's existing data
        $("#hospitalId").val(hospital.hospitalID);
        $("#hospitalName").val(hospital.name);
        $("#hospitalOwner").val(hospital.owner);
        // show the form
        $("#hospitalForm").show();
    }

    // FUNCTION 5: hides the form and resets it
    function hideForm() {
        $("#hospitalForm").hide();
        document.getElementById("hospitalForm").reset();
    }

    // FUNCTION 6: saves a hospital - decides whether to POST (add) or PUT (edit)
    function saveHospital() {
        // get the values from the form fields
        let id = $("#hospitalId").val();
        let name = $("#hospitalName").val();
        let owner = $("#hospitalOwner").val();

        // build the hospital object to send to the API
        let hospital = {
            name: name,
            owner: owner
        };

        // check if there is an ID or not
        if (id) {
            // ID exists → PUT request (edit existing hospital)
            fetch("/api/hospitals/" + id, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(hospital)
            })
                .then(function(response) { return response.json(); })
                .then(function() {
                    hideForm();
                    loadHospitals(); // reload table
                });
        } else {
            // no ID → POST request (add new hospital)
            fetch("/api/hospitals", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(hospital)
            })
                .then(function(response) { return response.json(); })
                .then(function() {
                    hideForm();
                    loadHospitals(); // reload table
                });
        }
    }

    // FUNCTION 7: DELETE a hospital by ID
    function deleteHospital(id) {
        // ask user to confirm before deleting - can cancel if they change their mind
        if (confirm("Are you sure you want to delete this hospital?")) {
            fetch("/api/hospitals/" + id, {
                method: "DELETE"
            })
                .then(function() {
                    loadHospitals(); // reload table after deleting
                });
        }
    }

    // FUNCTION 8: SEARCH hospitals by name
    function searchHospitals() {
        let name = $("#searchInput").val();

        fetch("/api/hospitals/search?name=" + name)
            .then(function(response) { return response.json(); })
            .then(function(hospitals) {
                $("#hospitalTableBody").empty();
                for (let hospital of hospitals) {
                    addRowToTable(hospital);
                }
            });
    }


</script>

</body>
</html>
