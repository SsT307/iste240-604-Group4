<!DOCTYPE html>
<!--// FATMA ALSUWAIDI - 406004792-->

<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Doctors</title>
    <!-- Bootstrap 5 CSS - for styling and responsiveness -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Shared CSS file -->
    <link href="style.css" rel="stylesheet">
    <!-- Bootstrap 5 JS - needed for interactive components -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- jQuery - for DOM manipulation and making API calls easier -->
    <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
</head>
<body>
<!-- main container - centers content and adds padding -->
<div class="container mt-4">
    <!-- page title -->
    <h1>Doctors</h1>
    <!-- top bar with search and add button -->
    <div class="d-flex mb-3">
        <!-- search bar -->
        <input type="text" id="searchInput" class="form-control me-2" placeholder="Search by speciality...">
        <!-- search button -->
        <button class="btn me-2" onclick="searchDoctors()">Search</button>
        <!-- add new doctor button -->
        <button class="btn" onclick="showAddForm()">Add Doctor</button>
    </div>
    <!-- table to display all doctors -->
    <table class="table table-bordered table-hover" id="doctorTable">
        <thead class="table-header">
        <tr>
            <th>ID</th>
            <th>First Name</th>
            <th>Last Name</th>
            <th>Speciality</th>
            <th>Hospital ID</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody id="doctorTableBody">
        <!-- rows will be added here dynamically by js -->
        </tbody>
    </table>
    <!-- form for adding/editing a doctor - hidden by default -->
    <form id="doctorForm" style="display:none;" class="mt-3">
        <h4>Doctor Form</h4>
        <!-- hidden field to store the ID when editing -->
        <input type="hidden" id="doctorId">
        <div class="mb-3">
            <label>First Name</label>
            <input type="text" id="doctorFirstName" class="form-control" placeholder="Enter first name">
        </div>
        <div class="mb-3">
            <label>Last Name</label>
            <input type="text" id="doctorLastName" class="form-control" placeholder="Enter last name">
        </div>
        <div class="mb-3">
            <label>Speciality</label>
            <input type="text" id="doctorSpeciality" class="form-control" placeholder="Enter speciality">
        </div>
        <div class="mb-3">
            <label>Hospital ID</label>
            <input type="number" id="doctorHospitalID" class="form-control" placeholder="Enter hospital ID">
        </div>
        <button type="button" class="btn" onclick="saveDoctor()">Save</button>
        <button type="button" class="btn" onclick="hideForm()">Cancel</button>
    </form>
</div>

<script>
    // when page is ready, load all doctors
    $(document).ready(function () {
        loadDoctors();
    });

    // FUNCTION 1: GET all doctors from API and display in table
    function loadDoctors() {
        fetch("/api/doctors")
            .then(function (response) {
                return response.json();
            })
            .then(function (doctors) {
                // clear table before adding new rows - prevents duplicates
                $("#doctorTableBody").empty();
                // loop through each doctor and add a row to the table
                for (let doctor of doctors) {
                    addRowToTable(doctor);
                }
            });
    }

    // FUNCTION 2: creates and adds one row to the table for a doct object
    function addRowToTable(doctor) {
        let row = $("<tr>");
        // add data cells
        row.append($("<td>").text(doctor.doctorID));
        row.append($("<td>").text(doctor.firstName));
        row.append($("<td>").text(doctor.lastName));
        row.append($("<td>").text(doctor.speciality));
        row.append($("<td>").text(doctor.hospitalID));
        // add edit & delete buttons in the last cell
        let actions = $("<td>");
        let editBtn = $("<button>")
            .text("Edit")
            .addClass("btn btn-sm me-2")
            .click(function () {
                showEditForm(doctor);
            });
        let deleteBtn = $("<button>")
            .text("Delete")
            .addClass("btn btn-sm")
            .click(function () {
                deleteDoctor(doctor.doctorID);
            });
        actions.append(editBtn);
        actions.append(deleteBtn);
        row.append(actions);
        $("#doctorTableBody").append(row);
    }

    // FUNCTION 3: GET one doctor by ID and show
    function viewDoctor(id) {
        fetch("/api/doctors/" + id)
            .then(function (response) {
                return response.json();
            })
            .then(function (doctor) {
                alert("ID: " + doctor.doctorID + "\nFirst Name: " + doctor.firstName + "\nLast Name: " + doctor.lastName + "\nSpeciality: " + doctor.speciality + "\nHospital ID: " + doctor.hospitalID);
            });
    }

    // FUNCTION 4: shows the empty form for adding a new doctor
    function showAddForm() {
        // clear all form fields at once
        document.getElementById("doctorForm").reset();
        // show the form
        $("#doctorForm").show();
    }

    // FUNCTION 5: shows the form filled with existing data for editing
    function showEditForm(doctor) {
        // fill the form with the doctor's existing data
        $("#doctorId").val(doctor.doctorID);
        $("#doctorFirstName").val(doctor.firstName);
        $("#doctorLastName").val(doctor.lastName);
        $("#doctorSpeciality").val(doctor.speciality);
        $("#doctorHospitalID").val(doctor.hospitalID);
        // show the form
        $("#doctorForm").show();
    }

    // FUNCTION 6: hides the form and resets it
    function hideForm() {
        $("#doctorForm").hide();
        document.getElementById("doctorForm").reset();
    }

    // FUNCTION 7: saves a doctor - decides whether to POST (add) or PUT (edit)
    function saveDoctor() {
        // get the values from the form fields
        let id = $("#doctorId").val();
        let firstName = $("#doctorFirstName").val();
        let lastName = $("#doctorLastName").val();
        let speciality = $("#doctorSpeciality").val();
        let hospitalID = parseInt($("#doctorHospitalID").val());
        // build the doctor object to send to the API
        let doctor = {
            doctorID: parseInt(id),
            firstName: firstName,
            lastName: lastName,
            speciality: speciality,
            hospitalID: hospitalID
        };
        // check if there is an ID or not
        if (id) {
            // ID exists--> PUT request (edit existing doctor)
            fetch("/api/doctors/" + id, {
                method: "PUT",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify(doctor)
            })
                .then(function (response) {
                    return response.json();
                })
                .then(function () {
                    hideForm();
                    loadDoctors(); // reload table
                });
        } else {
            // no ID--> POST request (add new doctor)
            fetch("/api/doctors", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify(doctor)
            })
                .then(function (response) {
                    return response.json();
                })
                .then(function () {
                    hideForm();
                    loadDoctors(); // reload table
                });
        }
    }

    // FUNCTION 8: DELETE a doctor by ID
    function deleteDoctor(id) {
        // ask user to confirm before deleting
        if (confirm("Are you sure you want to delete this doctor?")) {
            fetch("/api/doctors/" + id, {
                method: "DELETE"
            })
                .then(function () {
                    loadDoctors(); // reload table after deleting
                });
        }
    }

    // FUNCTION 9: SEARCH doctors by speciality
    function searchDoctors() {
        let speciality = $("#searchInput").val();
        fetch("/api/doctors/search?speciality=" + speciality)
            .then(function (response) {
                return response.json();
            })
            .then(function (doctors) {
                $("#doctorTableBody").empty();
                for (let doctor of doctors) {
                    addRowToTable(doctor);
                }
            });
    }
</script>
</body>
</html>
