<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedPRO - Insurance</title>
    <link rel="stylesheet" href="styles.css">

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>

</head>
<body>

<div class="app-shell">

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-logo">
            <a href="index.html" class="logo-link">
                <img src="medPro_logo1.png" alt="MedPRO Logo" class="logo-icon"/>
                <span class="sidebar-logo-text">MedPRO</span>
            </a>
        </div>

        <nav class="sidebar-nav">
            <a href="index.html" class="nav-item active">DASHBOARD</a>
            <a href="calendar.html" class="nav-item">CALENDAR</a>
            <a href="specialists.html" class="nav-item">DOCTORS</a>
            <a href="medicalRecord.html" class="nav-item">MEDICAL RECORDS</a>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <a href="index.html" class="back-link">← Back to Dashboard</a>
        <div class="page-header">
            <h1 class="page-title">Insurance</h1>
        </div>

        <div class="reports-container entity-page-wrap">

            <div class="reports-header">
                <h2 class="reports-section-title">Manage Insurance</h2>
            </div>

            <div class="entity-toolbar insurance-search-toolbar">
                <input type="text" id="searchName" class="form-input entity-search" placeholder="Search...">
                <button class="btn-action secondary" type="button" onclick="searchInsurance()">Search</button>
                <button class="btn-action ghost" type="button" onclick="loadAllInsurance()">View All</button>
                <button class="btn-action primary" type="button" onclick="openInsuranceModal()">Add Insurance</button>
            </div>

            <!-- TABLE -->
            <div class="table-card">
                <div class="table-scroll">
                    <table class="data-table insurance-table">
                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Edit</th>
                            <th>Delete</th>
                        </tr>
                        </thead>
                        <tbody id="insuranceTableBody"></tbody>
                    </table>
                </div>
            </div>

        </div>

    </main>

</div>

<footer class="app-footer">
    <span class="footer-copy">&copy; 2026 MedPRO. All rights reserved.</span>
    <div class="footer-links">
        <a href="#">Privacy Policy</a>
        <a href="#">Terms of Use</a>
        <a href="#">Support</a>
    </div>
</footer>

<!-- Modal form for add and update -->
<div class="modal-overlay" id="insuranceModal">
    <div class="modal-card">
        <h3 class="modal-title">Insurance Form</h3>
        <input type="hidden" id="insuranceID">

        <div class="form-grid">
            <div class="form-group-field full-width">
                <label class="form-label" for="insuranceName">Insurance Name</label>
                <input type="text" id="insuranceName" class="form-input" placeholder="Insurance Name">
            </div>
        </div>

        <div class="modal-actions">
            <button class="btn-action primary" type="button" onclick="addInsurance()">Add</button>
            <button class="btn-action secondary" type="button" onclick="updateInsurance()">Update</button>
            <button class="btn-action ghost" type="button" onclick="clearForm()">Clear</button>
            <button class="btn-action ghost" type="button" onclick="closeInsuranceModal()">Cancel</button>
        </div>
    </div>
</div>

<!-- JS -->
<script>

    // run when page loads
    $(document).ready(function () {
        loadAllInsurance(); // load all data automatically
    });

    // open insurance modal
    function openInsuranceModal() {
        $("#insuranceModal").addClass("open");
    }

    // close insurance modal
    function closeInsuranceModal() {
        $("#insuranceModal").removeClass("open");
    }

    // get all insurance records from backend
    function loadAllInsurance() {
        $.ajax({
            url: "/api/insurance",
            type: "GET",
            success: function (data) {
                displayInsurance(data); // show data in table
            }
        });
    }

    // add new insurance
    function addInsurance() {
        let insuranceName = $("#insuranceName").val(); // get input value

        let obj = {
            insuranceName: insuranceName // create object to send
        };

        $.ajax({
            url: "/api/insurance",
            type: "POST",
            contentType: "application/json",
            data: JSON.stringify(obj), // convert to JSON
            success: function () {
                loadAllInsurance(); // refresh table
                clearForm(); // clear input
                closeInsuranceModal(); // close modal
            }
        });
    }

    // search insurance by name
    function searchInsurance() {
        let name = $("#searchName").val(); // get search input

        $.ajax({
            url: "/api/insurance/search?insuranceName=" + name, // search API
            type: "GET",
            success: function (response) {
                displayInsurance(response); // show results
            }
        });
    }

    // update insurance name using ID
    function updateInsurance() {
        let id = $("#insuranceID").val(); // get selected ID
        let name = $("#insuranceName").val(); // get new name

        let obj = {
            insuranceName: name
        };

        $.ajax({
            url: "/api/insurance/" + id,
            type: "PUT",
            contentType: "application/json",
            data: JSON.stringify(obj),
            success: function () {
                loadAllInsurance(); // refresh table
                clearForm(); // clear input
                closeInsuranceModal(); // close modal
            }
        });
    }

    // delete insurance by ID
    function deleteInsurance(id) {
        $.ajax({
            url: "/api/insurance/" + id,
            type: "DELETE",
            success: function () {
                loadAllInsurance(); // refresh table
            }
        });
    }

    // fill form when user clicks edit
    function editInsurance(id, name) {
        $("#insuranceID").val(id);
        $("#insuranceName").val(name);
        openInsuranceModal();
    }

    // display data in table
    function displayInsurance(response) {
        let rows = "";

        $.each(response, function (key, value) {
            rows += `
            <tr>
                <td>${value.insuranceID}</td>
                <td>${value.insuranceName}</td>
                <td>
                    <button onclick="editInsurance(${value.insuranceID}, '${value.insuranceName}')">
                        Edit
                    </button>
                </td>
                <td>
                    <button onclick="deleteInsurance(${value.insuranceID})">
                        Delete
                    </button>
                </td>
            </tr>
        `;
        });

        $("#insuranceTableBody").html(rows); // update table
    }

    // clear input fields
    function clearForm() {
        $("#insuranceID").val("");
        $("#insuranceName").val("");
    }

    // close modal when clicking outside modal card
    $("#insuranceModal").on("click", function (event) {
        if (event.target === this) {
            closeInsuranceModal();
        }
    });

</script>

</body>
</html>
