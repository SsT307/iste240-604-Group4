<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedPRO - My Specialists</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app-shell">

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-logo">
            <a href="index.html" class="logo-link">
               <img src="medPro_logo1.png" alt="MedPRO" class="logo-icon" />
                <span class="sidebar-logo-text">MedPRO</span>
            </a>
        </div>

        <!-- Navigation Links -->
        <nav class="sidebar-nav">
            <a href="index.html" class="nav-item">DASHBOARD</a>
            <a href="reports.html" class="nav-item">MEDICAL REPORTS</a>
            <a href="calendar.html" class="nav-item">CALENDAR</a>
            <a href="specialists.html" class="nav-item active">MY SPECIALISTS</a>
        </nav>

        <div class="sidebar-user">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <circle cx="12" cy="8" r="4"/>
                <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
            </svg>
            <span class="sidebar-user-name">First Last</span>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">

        <!-- Header -->
        <div class="page-header">
            <h1 class="page-title">My Specialists</h1>
        </div>

        <p class="assignment2-label">NOT ASSIGNMENT 2</p>


        <!-- Specialists Grid -->
        <div class="specialists-grid-container">

            <!-- Doctor Card -->
            <div class="doctor-card">
                <span class="doctor-rating">4.9</span>
                <div class="doctor-avatar"></div>
                <h3 class="doctor-name">Dr. First Last</h3>
                <p class="doctor-specialty">SPECIALIST</p>
                <div class="doctor-actions">
                    <button class="btn-doctor-action">Contact</button>
                </div>
            </div>

        </div>

    </main>

</div>

<!-- Footer -->
<footer class="app-footer">
    <span class="footer-copy">© 2026 MedPRO. All rights reserved.</span>
    <div class="footer-links">
        <a href="#">Privacy Policy</a>
        <a href="#">Terms of Use</a>
        <a href="#">Support</a>
    </div>
</footer>

</body>
</html>
