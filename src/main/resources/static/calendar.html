<!DOCTYPE html>
<!-- Shaikha Alhajri 418008663 -->
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MedPRO - Calendar</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>

<!-- App shell -->
<div class="app-shell">
    <!-- Sidebar navigation -->
    <aside class="sidebar">
        <div class="sidebar-logo">
            <a href="index.html" class="logo-link">
                <img src="medPro_logo1.png" alt="MedPRO" class="logo-icon" />
                <span class="sidebar-logo-text">MedPRO</span>
            </a>
        </div>

        <!-- Sidebar links -->
        <nav class="sidebar-nav">
            <a href="index.html" class="nav-item">DASHBOARD</a>
            <a href="calendar.html" class="nav-item active">CALENDAR</a>
            <a href="specialists.html" class="nav-item">DOCTORS</a>
            <a href="reports.html" class="nav-item">MEDICAL RECORDS</a>
        </nav>

    </aside>

    <!-- Main page content -->
    <main class="main-content">

        <div class="page-header">
            <h1 class="page-title">Calendar</h1>
        </div>

        <div class="calendar-layout">
            <div class="calendar-main">
                <div class="calendar-toolbar">
                    <button class="btn-add-apt" id="addAptBtn" title="Add appointment">+</button>
                </div>

                <div class="month-grid-wrapper">
                    <div class="month-nav">
                        <button class="month-nav-btn" id="prevMonth">&#8249;</button>
                        <span class="month-nav-title" id="monthNavLabel"></span>
                        <button class="month-nav-btn" id="nextMonth">&#8250;</button>
                    </div>
                    <div class="month-day-names">
                        <div class="month-day-name">Sun</div>
                        <div class="month-day-name">Mon</div>
                        <div class="month-day-name">Tue</div>
                        <div class="month-day-name">Wed</div>
                        <div class="month-day-name">Thu</div>
                        <div class="month-day-name">Fri</div>
                        <div class="month-day-name">Sat</div>
                    </div>
                    <div class="month-days" id="monthDays"></div>
                </div>
            </div>
        </div>

    </main>
</div>

<!-- Footer section -->
<footer class="app-footer">
    <span class="footer-copy">&copy; 2026 MedPRO. All rights reserved.</span>
    <div class="footer-links">
        <a href="#">Privacy Policy</a>
        <a href="#">Terms of Use</a>
        <a href="#">Support</a>
    </div>
</footer>

<!-- Modal for adding or updating appointments -->
<div class="appoint-overlay" id="addAppoint">
    <div class="appoint">
        <div class="appoint-title" id="appointmentFormTitle">Add Appointment</div>

        <input type="hidden" id="appointmentId" />

        <div class="form-grid">
            <div class="form-group-field">
                <label class="form-label" for="aptDate">Date</label>
                <input type="date" class="form-input" id="aptDate" />
            </div>
            <div class="form-group-field">
                <label class="form-label" for="aptTime">Time</label>
                <input type="time" class="form-input" id="aptTime" />
            </div>
            <div class="form-group-field full-width">
                <label class="form-label" for="aptReason">Reason</label>
                <input type="text" class="form-input" id="aptReason" placeholder="e.g. Annual checkup" />
            </div>
            <div class="form-group-field">
                <label class="form-label" for="aptPatient">Patient ID</label>
                <input type="number" class="form-input" id="aptPatient" placeholder="Enter Patient ID" />
            </div>
            <div class="form-group-field">
                <label class="form-label" for="aptDoctor">Doctor ID</label>
                <input type="number" class="form-input" id="aptDoctor" placeholder="Enter doctor ID" />
            </div>
            <div class="form-group-field full-width">
                <label class="form-label" for="aptHospital">Hospital ID</label>
                <input type="number" class="form-input" id="aptHospital" placeholder="Enter hospital ID" />
            </div>
        </div>

        <div class="appoint-actions">
            <button class="btn-cancel" id="addCancelBtn">Cancel</button>
            <button class="btn-primary" id="saveAptBtn">Save</button>
        </div>
    </div>
</div>

<!-- Modal for viewing appointment details -->
<div class="appoint-overlay" id="detailsAppoint">
    <div class="appoint">
        <div class="appoint-title" id="detailsTitle">Appointment Details</div>
        <div class="detail-grid">
            <div class="detail-row">
                <span class="detail-label">Date</span>
                <span class="detail-value" id="dDate"></span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Time</span>
                <span class="detail-value" id="dTime"></span>
            </div>
            <div class="detail-row full-width">
                <span class="detail-label">Reason</span>
                <span class="detail-value" id="dReason"></span>
            </div>
            <div class="detail-row full-width">
                <span class="detail-label">Patient ID</span>
                <span class="detail-value" id="dPatient"></span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Doctor ID</span>
                <span class="detail-value" id="dDoctor"></span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Hospital ID</span>
                <span class="detail-value" id="dHospital"></span>
            </div>
        </div>
        <hr class="appoint-divider" />
        <div class="appoint-actions">
            <button class="btn-cancel" id="detailsCloseBtn">Close</button>
            <button class="btn-secondary" id="detailsEditBtn">Edit</button>
            <button class="btn-cancel" id="detailsDeleteBtn">Delete</button>
        </div>
    </div>
</div>

<script src="shared-ui.js"></script>
<script>
    // Get references for calendar header and month grid
    const monthNavLabel = document.getElementById("monthNavLabel");
    const monthDays = document.getElementById("monthDays");
    const prevMonthBtn = document.getElementById("prevMonth");
    const nextMonthBtn = document.getElementById("nextMonth");

    // Get references for add appointment modal controls
    const addAptBtn = document.getElementById("addAptBtn");
    const addAppointOverlay = document.getElementById("addAppoint");
    const addCancelBtn = document.getElementById("addCancelBtn");
    const saveAptBtn = document.getElementById("saveAptBtn");

    // Get references for appointment form inputs
    const appointmentFormTitle = document.getElementById("appointmentFormTitle");
    const appointmentIdInput = document.getElementById("appointmentId");
    const aptDateInput = document.getElementById("aptDate");
    const aptTimeInput = document.getElementById("aptTime");
    const aptReasonInput = document.getElementById("aptReason");
    const aptHospitalInput = document.getElementById("aptHospital");
    const aptDoctorInput = document.getElementById("aptDoctor");
    const aptPatientInput = document.getElementById("aptPatient");

    // Get references for details modal controls
    const detailsAppointOverlay = document.getElementById("detailsAppoint");
    const detailsCloseBtn = document.getElementById("detailsCloseBtn");
    const detailsEditBtn = document.getElementById("detailsEditBtn");
    const detailsDeleteBtn = document.getElementById("detailsDeleteBtn");
    const detailsTitle = document.getElementById("detailsTitle");
    const dDate = document.getElementById("dDate");
    const dTime = document.getElementById("dTime");
    const dReason = document.getElementById("dReason");
    const dPatient = document.getElementById("dPatient");
    const dDoctor = document.getElementById("dDoctor");
    const dHospital = document.getElementById("dHospital");

    // Shared month names for month title rendering
    const MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

    const today = new Date();
    let monthDate = new Date(today);
    let appointments = [];
    let activeAppointment = null;

    // This helper converts time from 24-hour to AM/PM format
    function formatTime(time) {
        const cleanTime = String(time || "").slice(0, 5);
        if (!cleanTime.includes(":")) return "";
        const parts = cleanTime.split(":");
        let hours = Number(parts[0]);
        const minutes = Number(parts[1]);
        const period = hours >= 12 ? "PM" : "AM";
        hours = hours % 12 || 12;
        return `${hours}:${String(minutes).padStart(2, "0")} ${period}`;
    }

    // This helper creates a readable date text for the details modal
    function formatDateLabel(dateValue) {
        const parsed = new Date(dateValue);
        if (Number.isNaN(parsed.getTime())) {
            return dateValue || "";
        }
        return parsed.toLocaleDateString("en-GB", {
            weekday: "long",
            day: "numeric",
            month: "long",
            year: "numeric"
        });
    }

    // This function loads all appointments from the API
    // It keeps calendar data connected to the database
    async function loadAppointments() {
        try {
            const response = await fetch("/api/appointments");
            const data = await response.json();
            appointments = Array.isArray(data) ? data : [];
            buildMonthView();
        } catch (error) {
            MedProUI.showToast("Could not load appointments.", "error");
        }
    }

    // This function builds the full month calendar grid
    // It places appointment pills inside matching dates
    function buildMonthView() {
        monthNavLabel.textContent = `${MONTHS[monthDate.getMonth()]} ${monthDate.getFullYear()}`;

        const year = monthDate.getFullYear();
        const month = monthDate.getMonth();
        const firstDayOfMonth = new Date(year, month, 1);
        const lastDayOfMonth = new Date(year, month + 1, 0).getDate();
        const startPadding = firstDayOfMonth.getDay();

        monthDays.innerHTML = "";

        const totalCells = 42;
        for (let i = 0; i < totalCells; i++) {
            const dayOffset = i - startPadding;
            const currentDate = new Date(year, month, 1 + dayOffset);
            const dateString = currentDate.toISOString().slice(0, 10);
            const isOtherMonth = dayOffset < 0 || dayOffset >= lastDayOfMonth;

            const cell = document.createElement("div");
            cell.className = "month-cell"
                + (isOtherMonth ? " other-month" : "")
                + (currentDate.toDateString() === today.toDateString() ? " today" : "");

            const dayNumber = document.createElement("div");
            dayNumber.className = "month-cell-num";
            dayNumber.textContent = currentDate.getDate();
            cell.appendChild(dayNumber);

            const dayAppointments = appointments.filter(function (apt) {
                return String(apt.date).slice(0, 10) === dateString;
            });

            dayAppointments.forEach(function (apt) {
                const pill = document.createElement("div");
                pill.className = "month-apt";
                pill.innerHTML = `<span class="month-apt-reason">${MedProUI.sanitize(apt.reason)}</span>
                                  <span class="month-apt-time">${formatTime(apt.time)} · Doctor ${apt.doctorID ?? "-"}</span>`;
                pill.addEventListener("click", function (event) {
                    event.stopPropagation();
                    showAppointmentDetails(apt);
                });
                cell.appendChild(pill);
            });

            cell.addEventListener("click", function () {
                openAddForm(dateString);
            });

            monthDays.appendChild(cell);
        }
    }

    // This function clears all form inputs before opening the modal
    function resetAppointmentForm() {
        appointmentIdInput.value = "";
        aptDateInput.value = "";
        aptTimeInput.value = "";
        aptReasonInput.value = "";
        aptHospitalInput.value = "";
        aptDoctorInput.value = "";
        aptPatientInput.value = "";
    }

    // This runs when user adds a new appointment
    // It opens the modal and can prefill the clicked date
    function openAddForm(selectedDate = "") {
        resetAppointmentForm();
        appointmentFormTitle.textContent = "Add Appointment";
        aptDateInput.value = selectedDate;
        addAppointOverlay.classList.add("open");
    }

    // This runs when user edits an appointment from details modal
    // It fills the form with existing values
    function openEditForm(appointment) {
        appointmentFormTitle.textContent = "Update Appointment";
        appointmentIdInput.value = appointment.appointmentID ?? "";
        aptDateInput.value = String(appointment.date || "").slice(0, 10);
        aptTimeInput.value = String(appointment.time || "").slice(0, 5);
        aptReasonInput.value = appointment.reason ?? "";
        aptHospitalInput.value = appointment.hospitalID ?? "";
        aptDoctorInput.value = appointment.doctorID ?? "";
        aptPatientInput.value = appointment.patientID ?? "";
        addAppointOverlay.classList.add("open");
    }

    // This function saves a new or updated appointment
    // It sends POST or PUT to the appointments API
    async function saveAppointment() {
        const appointmentID = appointmentIdInput.value.trim();
        const payload = {
            date: aptDateInput.value,
            time: aptTimeInput.value,
            reason: aptReasonInput.value.trim(),
            patientID: Number(aptPatientInput.value),
            doctorID: Number(aptDoctorInput.value),
            hospitalID: Number(aptHospitalInput.value)
        };

        if (!payload.date || !payload.time || !payload.reason || !payload.patientID || !payload.doctorID || !payload.hospitalID) {
            MedProUI.showToast("Please fill all appointment fields.", "error");
            return;
        }

        if (appointmentID) {
            payload.appointmentID = Number(appointmentID);
        }

        const url = appointmentID ? `/api/appointments/${appointmentID}` : "/api/appointments";
        const method = appointmentID ? "PUT" : "POST";

        try {
            const response = await fetch(url, {
                method,
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });

            if (!response.ok) {
                throw new Error("Save failed");
            }

            addAppointOverlay.classList.remove("open");
            MedProUI.showToast(appointmentID ? "Appointment updated." : "Appointment added.");
            await loadAppointments();
        } catch (error) {
            MedProUI.showToast("Unable to save appointment.", "error");
        }
    }

    // This function opens the details modal for one appointment
    function showAppointmentDetails(appointment) {
        activeAppointment = appointment;

        detailsTitle.textContent = appointment.reason || "Appointment Details";
        dDate.textContent = formatDateLabel(appointment.date);
        dTime.textContent = formatTime(appointment.time);
        dReason.textContent = appointment.reason || "";
        dPatient.textContent = appointment.patientID ?? "";
        dDoctor.textContent = appointment.doctorID ?? "";
        dHospital.textContent = appointment.hospitalID ?? "";

        detailsAppointOverlay.classList.add("open");
    }

    // This function deletes the selected appointment
    // It calls DELETE only after user confirmation
    async function deleteActiveAppointment() {
        if (!activeAppointment || !activeAppointment.appointmentID) {
            return;
        }

        if (!confirm("Delete this appointment?")) {
            return;
        }

        try {
            const response = await fetch(`/api/appointments/${activeAppointment.appointmentID}`, { method: "DELETE" });
            if (!response.ok) {
                throw new Error("Delete failed");
            }
            detailsAppointOverlay.classList.remove("open");
            MedProUI.showToast("Appointment deleted.");
            await loadAppointments();
        } catch (error) {
            MedProUI.showToast("Unable to delete appointment.", "error");
        }
    }

    // Move to previous month
    prevMonthBtn.addEventListener("click", function () {
        monthDate.setMonth(monthDate.getMonth() - 1);
        buildMonthView();
    });

    // Move to next month
    nextMonthBtn.addEventListener("click", function () {
        monthDate.setMonth(monthDate.getMonth() + 1);
        buildMonthView();
    });

    // Open add modal from the main plus button
    addAptBtn.addEventListener("click", function () {
        openAddForm(today.toISOString().slice(0, 10));
    });

    // Close add modal from cancel button
    addCancelBtn.addEventListener("click", function () {
        addAppointOverlay.classList.remove("open");
    });

    // Close add modal when user clicks outside modal card
    addAppointOverlay.addEventListener("click", function (event) {
        if (event.target === addAppointOverlay) {
            addAppointOverlay.classList.remove("open");
        }
    });

    // Save button action for add/update form
    saveAptBtn.addEventListener("click", saveAppointment);

    // Close details modal from close button
    detailsCloseBtn.addEventListener("click", function () {
        detailsAppointOverlay.classList.remove("open");
    });

    // Open edit form from details modal
    detailsEditBtn.addEventListener("click", function () {
        if (!activeAppointment) return;
        detailsAppointOverlay.classList.remove("open");
        openEditForm(activeAppointment);
    });

    // Delete current appointment from details modal
    detailsDeleteBtn.addEventListener("click", deleteActiveAppointment);

    // Close details modal when user clicks outside modal card
    detailsAppointOverlay.addEventListener("click", function (event) {
        if (event.target === detailsAppointOverlay) {
            detailsAppointOverlay.classList.remove("open");
        }
    });

    // Initial load for calendar appointments
    loadAppointments();
</script>
</body>
</html>
