<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MedPRO - Calendar</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>

<div class="app-shell">

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-logo">
            <img src="medPro_logo1.png" alt="MedPRO" />
            <span class="sidebar-logo-text">MedPRO</span>
        </div>

        <!-- Navigation Links -->
        <nav class="sidebar-nav">
            <a href="#" class="nav-item">DASHBOARD</a>
            <a href="#" class="nav-item">MEDICAL REPORTS</a>
            <a href="calendar.html" class="nav-item active">CALENDAR</a>
            <a href="#" class="nav-item">MY SPECIALISTS</a>
        </nav>

        <!-- Profile & Logout -->
        <div class="sidebar-user" id="userProfile">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <circle cx="12" cy="8" r="4"/>
                <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
            </svg>
            <span class="sidebar-user-name">First Last</span>
            <span class="sidebar-user-caret">▲</span>

            <div class="user-dropdown" id="userDropdown">
                <div class="dropdown-item">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="8" r="4"/>
                        <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
                    </svg>
                    My Profile
                </div>
                <div class="dropdown-item">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="3"/>
                        <path d="M12 2v2m0 16v2M4.22 4.22l1.42 1.42m12.72 12.72 1.42 1.42M2 12h2m16 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
                    </svg>
                    Settings
                </div>
                <div class="dropdown-item logout" id="logoutBtn">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                        <polyline points="16 17 21 12 16 7"/>
                        <line x1="21" y1="12" x2="9" y2="12"/>
                    </svg>
                    Log Out
                </div>
            </div>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">

        <div class="page-header">
            <h1 class="page-title">Calendar</h1>
        </div>

        <div class="calendar-layout">

            <!-- Upcoming Appointments Panel -->
            <div class="calendar-side">
                <div class="upcoming-card">
                    <div class="upcoming-title">Upcoming</div>
                    <div id="upcomingList"></div>
                </div>
            </div>

            <!-- Monthly Calendar -->
            <div class="calendar-main">

                <!-- Add Appointment Button -->
                <div class="calendar-toolbar">
                    <button class="btn-add-apt" id="addAptBtn" title="Add appointment">+</button>
                </div>

                <!-- Calendar Grid -->
                <div class="month-grid-wrapper">
                    <div class="month-nav">
                        <button class="month-nav-btn" id="prevMonth">&#8249;</button>
                        <span class="month-nav-title" id="monthNavLabel"></span>
                        <button class="month-nav-btn" id="nextMonth">&#8250;</button>
                    </div>
                    <div class="month-day-names">
                        <div class="month-day-name">Sun</div>
                        <div class="month-day-name">Mon</div>
                        <div class="month-day-name">Tue</div>
                        <div class="month-day-name">Wed</div>
                        <div class="month-day-name">Thu</div>
                        <div class="month-day-name">Fri</div>
                        <div class="month-day-name">Sat</div>
                    </div>
                    <div class="month-days" id="monthDays"></div>
                </div>

            </div>
        </div>

    </main>
</div>

<!-- Footer -->
<footer class="app-footer">
    <span class="footer-copy">© 2026 MedPRO. All rights reserved.</span>
    <div class="footer-links">
        <a href="#">Privacy Policy</a>
        <a href="#">Terms of Use</a>
        <a href="#">Support</a>
    </div>
</footer>

<!-- Add Appointment -->
<div class="appoint-overlay" id="addAppoint">
    <div class="appoint">
        <div class="appoint-title">Add Appointment</div>
        <div class="form-grid">
            <div class="form-group-field">
                <label class="form-label" for="aptDate">Date</label>
                <input type="date" class="form-input" id="aptDate" />
            </div>
            <div class="form-group-field">
                <label class="form-label" for="aptTime">Time</label>
                <input type="time" class="form-input" id="aptTime" />
            </div>
            <div class="form-group-field full-width">
                <label class="form-label" for="aptReason">Reason</label>
                <input type="text" class="form-input" id="aptReason" placeholder="e.g. Annual checkup" />
            </div>
            <div class="form-group-field full-width">
                <label class="form-label" for="aptHospital">Hospital</label>
                <select class="form-select" id="aptHospital">
                    <option value="">Select hospital...</option>
                    <option>Dubai Hospital</option>
                    <option>Rashid Hospital</option>
                    <option>American Hospital Dubai</option>
                    <option>Cleveland Clinic Abu Dhabi</option>
                    <option>Mediclinic City Hospital</option>
                    <option>Al Zahra Hospital Dubai</option>
                </select>
            </div>
            <div class="form-group-field full-width">
                <label class="form-label" for="aptDoctor">Doctor</label>
                <select class="form-select" id="aptDoctor">
                    <option value="">Select doctor...</option>
                    <option>Dr. Al Mansoori - Cardiology</option>
                    <option>Dr. Hassan - Neurology</option>
                    <option>Dr. Patel - General Practice</option>
                    <option>Dr. Khalil - Orthopedics</option>
                    <option>Dr. Nguyen - Dermatology</option>
                </select>
            </div>
            <div class="form-group-field full-width">
                <label class="form-label" for="aptPatient">Patient ID</label>
                <input type="text" class="form-input" id="aptPatient" placeholder="784-YYYY-XXXXXXX-X" maxlength="18" inputmode="numeric" />
            </div>
        </div>
        <div class="appoint-actions">
            <button class="btn-cancel" id="addCancelBtn">Cancel</button>
            <button class="btn-primary" id="saveAptBtn">Save</button>
        </div>
    </div>
</div>

<!-- Appointment Details -->
<div class="appoint-overlay" id="detailsAppoint">
    <div class="appoint">
        <div class="appoint-title" id="detailsTitle">Appointment Details</div>
        <div class="detail-grid">
            <div class="detail-row">
                <span class="detail-label">Date</span>
                <span class="detail-value" id="dDate"></span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Time</span>
                <span class="detail-value" id="dTime"></span>
            </div>
            <div class="detail-row full-width">
                <span class="detail-label">Reason</span>
                <span class="detail-value" id="dReason"></span>
            </div>
            <div class="detail-row full-width">
                <span class="detail-label">Patient ID</span>
                <span class="detail-value" id="dPatient"></span>
            </div>
            <div class="detail-row full-width">
                <span class="detail-label">Doctor</span>
                <span class="detail-value" id="dDoctor"></span>
            </div>
            <div class="detail-row full-width">
                <span class="detail-label">Hospital</span>
                <div class="hospital-badge">
                    <span class="hospital-badge-dot"></span>
                    <span id="dHospital"></span>
                </div>
            </div>
        </div>
        <hr class="appoint-divider" />
        <div class="appoint-actions">
            <button class="btn-cancel" id="detailsCloseBtn">Close</button>
        </div>
    </div>
</div>

<!-- JavaScript -->
<script>
    // Appointment data -- seeded with sample records from multiple hospitals
    const today = new Date();
    let monthDate = new Date(today);

    const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

    const appointments = [
        { date: fmt(0), time: '09:00', reason: 'Annual checkup',    patient: '784-1993-4821736-0', doctor: 'Dr. Patel - General Practice',     hospital: 'Dubai Hospital' },
        { date: fmt(1), time: '11:30', reason: 'Follow-up visit',   patient: '784-1982-2871336-0', doctor: 'Dr. Hassan - Neurology',            hospital: 'Rashid Hospital' },
        { date: fmt(3), time: '14:00', reason: 'Blood test',        patient: '784-2001-7739482-0', doctor: 'Dr. Al Mansoori - Cardiology',      hospital: 'American Hospital Dubai' },
        { date: fmt(5), time: '10:00', reason: 'MRI scan review',   patient: '784-1975-1204857-1', doctor: 'Dr. Khalil - Orthopedics',          hospital: 'Cleveland Clinic Abu Dhabi' },
        { date: fmt(7), time: '08:30', reason: 'Skin consultation', patient: '784-1987-3056214-1', doctor: 'Dr. Nguyen - Dermatology',          hospital: 'Mediclinic City Hospital' }
    ];

    // Returns a YYYY-MM-DD string offset by the given number of days from today
    function fmt(offset = 0) {
        const d = new Date(today);
        d.setDate(d.getDate() + offset);
        return d.toISOString().slice(0, 10);
    }

    // Converts "14:00" to "2:00 PM"
    function formatTime(t) {
        let [h, m] = t.split(':').map(Number);
        const suffix = h >= 12 ? 'PM' : 'AM';
        h = h % 12 || 12;
        return `${h}:${String(m).padStart(2, '0')} ${suffix}`;
    }

    // Opens or closes an overlay by id
    function toggleAppoint(id, open) {
        document.getElementById(id).classList.toggle('open', open);
    }

    // Profile dropdown
    const userProfile = document.getElementById('userProfile');
    userProfile.addEventListener('click', e => {
        e.stopPropagation();
        userProfile.classList.toggle('open');
        document.getElementById('userDropdown').classList.toggle('open');
    });
    document.addEventListener('click', () => {
        userProfile.classList.remove('open');
        document.getElementById('userDropdown').classList.remove('open');
    });
    document.getElementById('logoutBtn').addEventListener('click', () => window.location.href = 'index.html');

    // Auto-format Patient ID as Emirates ID: 784-YYYY-XXXXXXX-X
    document.getElementById('aptPatient').addEventListener('input', function () {
        const digits = this.value.replace(/\D/g, '').slice(0, 15);
        const p = [digits.slice(0, 3), digits.slice(3, 7), digits.slice(7, 14), digits.slice(14, 15)];
        this.value = p.filter(s => s.length).join('-');
    });

    // Build the monthly calendar grid
    function buildMonthView() {
        document.getElementById('monthNavLabel').textContent = MONTHS[monthDate.getMonth()] + ' ' + monthDate.getFullYear();

        const grid     = document.getElementById('monthDays');
        const first    = new Date(monthDate.getFullYear(), monthDate.getMonth(), 1);
        const lastDay  = new Date(monthDate.getFullYear(), monthDate.getMonth() + 1, 0).getDate();
        const startPad = first.getDay();

        grid.innerHTML = '';

        // Fill grid: prev month padding + current days + next month padding
        const totalCells = 42;
        for (let i = 0; i < totalCells; i++) {
            const offset = i - startPad;
            const d      = new Date(monthDate.getFullYear(), monthDate.getMonth(), 1 + offset);
            const ds     = d.toISOString().slice(0, 10);
            const other  = offset < 0 || offset >= lastDay;

            const cell = document.createElement('div');
            cell.className = 'month-cell'
                + (other ? ' other-month' : '')
                + (d.toDateString() === today.toDateString() ? ' today' : '');

            // Date number
            const num = document.createElement('div');
            num.className = 'month-cell-num';
            num.textContent = d.getDate();
            cell.appendChild(num);

            // Appointment pills for this day
            appointments.filter(a => a.date === ds).forEach(a => {
                const pill = document.createElement('div');
                pill.className = 'month-apt';
                pill.innerHTML = `<span class="month-apt-reason">${a.reason}</span>
                                  <span class="month-apt-time">${formatTime(a.time)} · ${a.hospital}</span>`;
                pill.addEventListener('click', e => { e.stopPropagation(); openDetails(a); });
                cell.appendChild(pill);
            });

            // Empty cell click opens add form
            cell.addEventListener('click', () => openAdd(ds));
            grid.appendChild(cell);
        }
    }

    document.getElementById('prevMonth').addEventListener('click', () => { monthDate.setMonth(monthDate.getMonth() - 1); buildMonthView(); buildUpcoming(); });
    document.getElementById('nextMonth').addEventListener('click', () => { monthDate.setMonth(monthDate.getMonth() + 1); buildMonthView(); buildUpcoming(); });

    // Build upcoming appointments list
    function buildUpcoming() {
        const now  = today.toISOString().slice(0, 10);
        const list = appointments
            .filter(a => a.date >= now)
            .sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time))
            .slice(0, 5);

        document.getElementById('upcomingList').innerHTML = list.length
            ? list.map(a => {
                const lbl = new Date(a.date).toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
                return `<div class="upcoming-item">
                            <div class="upcoming-dot"></div>
                            <div class="upcoming-info">
                                <div class="upcoming-name">${a.reason}</div>
                                <div class="upcoming-time">${lbl} · ${formatTime(a.time)}</div>
                            </div>
                        </div>`;
            }).join('')
            : '<div style="font-size:.78rem;color:var(--text-muted)">No upcoming appointments.</div>';
    }

    // Open the add appointment form, pre-fill date
    function openAdd(date = '') {
        ['aptDate','aptTime','aptReason','aptPatient'].forEach(id => document.getElementById(id).value = '');
        ['aptHospital','aptDoctor'].forEach(id => document.getElementById(id).value = '');
        document.getElementById('aptDate').value = date;
        toggleAppoint('addAppoint', true);
    }

    document.getElementById('addCancelBtn').addEventListener('click', () => toggleAppoint('addAppoint', false));
    document.getElementById('addAppoint').addEventListener('click', e => { if (e.target.id === 'addAppoint') toggleAppoint('addAppoint', false); });
    document.getElementById('addAptBtn').addEventListener('click', () => openAdd(fmt()));

    document.getElementById('saveAptBtn').addEventListener('click', () => {
        const fields = ['aptDate','aptTime','aptReason','aptHospital','aptDoctor','aptPatient'];
        const vals   = fields.map(id => document.getElementById(id).value.trim());
        if (vals.some(v => !v)) { alert('Please fill in all fields.'); return; }
        appointments.push({ date: vals[0], time: vals[1], reason: vals[2], hospital: vals[3], doctor: vals[4], patient: vals[5] });
        toggleAppoint('addAppoint', false);
        buildMonthView();
        buildUpcoming();
    });

    // Open the appointment details view
    function openDetails(a) {
        const lbl = new Date(a.date).toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
        document.getElementById('detailsTitle').textContent = a.reason;
        document.getElementById('dDate').textContent        = lbl;
        document.getElementById('dTime').textContent        = formatTime(a.time);
        document.getElementById('dReason').textContent      = a.reason;
        document.getElementById('dPatient').textContent     = a.patient;
        document.getElementById('dDoctor').textContent      = a.doctor;
        document.getElementById('dHospital').textContent    = a.hospital;
        toggleAppoint('detailsAppoint', true);
    }

    document.getElementById('detailsCloseBtn').addEventListener('click', () => toggleAppoint('detailsAppoint', false));
    document.getElementById('detailsAppoint').addEventListener('click', e => { if (e.target.id === 'detailsAppoint') toggleAppoint('detailsAppoint', false); });

    // Init
    buildMonthView();
    buildUpcoming();
</script>
</body>
</html>
