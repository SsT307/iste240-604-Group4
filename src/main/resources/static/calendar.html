<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MedPRO - Calendar</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>

<div class="app-shell">

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-logo">
            <a href="index.html" class="logo-link">
                <img src="medPro_logo1.png" alt="MedPRO" class="logo-icon" />
                <span class="sidebar-logo-text">MedPRO</span>
            </a>
        </div>

        <!-- Navigation Links -->
        <nav class="sidebar-nav">
            <a href="index.html" class="nav-item">DASHBOARD</a>
            <a href="reports.html" class="nav-item">MEDICAL REPORTS</a>
            <a href="calendar.html" class="nav-item active">CALENDAR</a>
            <a href="specialists.html" class="nav-item">MY SPECIALISTS</a>
        </nav>

        <!-- Profile & Logout -->
        <div class="sidebar-user" id="userProfile">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <circle cx="12" cy="8" r="4"/>
                <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
            </svg>
            <span class="sidebar-user-name">First Last</span>
            <span class="sidebar-user-caret">▲</span>

            <div class="user-dropdown" id="userDropdown">
                <div class="dropdown-item">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="8" r="4"/>
                        <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
                    </svg>
                    My Profile
                </div>
                <div class="dropdown-item">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="3"/>
                        <path d="M12 2v2m0 16v2M4.22 4.22l1.42 1.42m12.72 12.72 1.42 1.42M2 12h2m16 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
                    </svg>
                    Settings
                </div>
                <div class="dropdown-item logout" id="logoutBtn">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                        <polyline points="16 17 21 12 16 7"/>
                        <line x1="21" y1="12" x2="9" y2="12"/>
                    </svg>
                    Log Out
                </div>
            </div>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">

        <div class="page-header">
            <h1 class="page-title">Calendar</h1>
        </div>

        <div class="calendar-layout">

            <!-- Monthly Calendar -->
            <div class="calendar-main">

                <!-- Add Appointment Button -->
                <div class="calendar-toolbar">
                    <button class="btn-add-apt" id="addAptBtn" title="Add appointment">+</button>
                </div>

                <!-- Calendar Grid -->
                <div class="month-grid-wrapper">
                    <div class="month-nav">
                        <button class="month-nav-btn" id="prevMonth">&#8249;</button>
                        <span class="month-nav-title" id="monthNavLabel"></span>
                        <button class="month-nav-btn" id="nextMonth">&#8250;</button>
                    </div>
                    <div class="month-day-names">
                        <div class="month-day-name">Sun</div>
                        <div class="month-day-name">Mon</div>
                        <div class="month-day-name">Tue</div>
                        <div class="month-day-name">Wed</div>
                        <div class="month-day-name">Thu</div>
                        <div class="month-day-name">Fri</div>
                        <div class="month-day-name">Sat</div>
                    </div>
                    <div class="month-days" id="monthDays"></div>
                </div>

            </div>
        </div>

    </main>
</div>

<!-- Footer -->
<footer class="app-footer">
    <span class="footer-copy">© 2026 MedPRO. All rights reserved.</span>
    <div class="footer-links">
        <a href="#">Privacy Policy</a>
        <a href="#">Terms of Use</a>
        <a href="#">Support</a>
    </div>
</footer>

<!-- Add Appointment -->
<div class="appoint-overlay" id="addAppoint">
    <div class="appoint">
        <div class="appoint-title">Add Appointment</div>
        <div class="form-grid">
            <div class="form-group-field">
                <label class="form-label" for="aptDate">Date</label>
                <input type="date" class="form-input" id="aptDate" />
            </div>
            <div class="form-group-field">
                <label class="form-label" for="aptTime">Time</label>
                <input type="time" class="form-input" id="aptTime" />
            </div>
            <div class="form-group-field full-width">
                <label class="form-label" for="aptReason">Reason</label>
                <input type="text" class="form-input" id="aptReason" placeholder="e.g. Annual checkup" />
            </div>
            <div class="form-group-field full-width">
                <label class="form-label" for="aptHospital">Hospital</label>
                <select class="form-select" id="aptHospital">
                    <option value="">Select hospital...</option>
                    <option>Dubai Hospital</option>
                    <option>Rashid Hospital</option>
                    <option>American Hospital Dubai</option>
                    <option>Cleveland Clinic Abu Dhabi</option>
                    <option>Mediclinic City Hospital</option>
                    <option>Al Zahra Hospital Dubai</option>
                </select>
            </div>
            <div class="form-group-field full-width">
                <label class="form-label" for="aptDoctor">Doctor</label>
                <select class="form-select" id="aptDoctor">
                    <option value="">Select doctor...</option>
                    <option>Dr. Al Mansoori - Cardiology</option>
                    <option>Dr. Hassan - Neurology</option>
                    <option>Dr. Patel - General Practice</option>
                    <option>Dr. Khalil - Orthopedics</option>
                    <option>Dr. Nguyen - Dermatology</option>
                </select>
            </div>
            <div class="form-group-field full-width">
                <label class="form-label" for="aptPatient">Patient ID</label>
                <input type="text" class="form-input" id="aptPatient" placeholder="784-YYYY-XXXXXXX-X" maxlength="18" inputmode="numeric" />
            </div>
        </div>
        <div class="appoint-actions">
            <button class="btn-cancel" id="addCancelBtn">Cancel</button>
            <button class="btn-primary" id="saveAptBtn">Save</button>
        </div>
    </div>
</div>

<!-- Appointment Details -->
<div class="appoint-overlay" id="detailsAppoint">
    <div class="appoint">
        <div class="appoint-title" id="detailsTitle">Appointment Details</div>
        <div class="detail-grid">
            <div class="detail-row">
                <span class="detail-label">Date</span>
                <span class="detail-value" id="dDate"></span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Time</span>
                <span class="detail-value" id="dTime"></span>
            </div>
            <div class="detail-row full-width">
                <span class="detail-label">Reason</span>
                <span class="detail-value" id="dReason"></span>
            </div>
            <div class="detail-row full-width">
                <span class="detail-label">Patient ID</span>
                <span class="detail-value" id="dPatient"></span>
            </div>
            <div class="detail-row full-width">
                <span class="detail-label">Doctor</span>
                <span class="detail-value" id="dDoctor"></span>
            </div>
            <div class="detail-row full-width">
                <span class="detail-label">Hospital</span>
                <div class="hospital-badge">
                    <span class="hospital-badge-dot"></span>
                    <span id="dHospital"></span>
                </div>
            </div>
        </div>
        <hr class="appoint-divider" />
        <div class="appoint-actions">
            <button class="btn-cancel" id="detailsCloseBtn">Close</button>
        </div>
    </div>
</div>

<!-- JavaScript -->
<script>

    const userProfile = document.getElementById('userProfile');
    const userDropdown = document.getElementById('userDropdown');
    const logoutBtn = document.getElementById('logoutBtn');

    const monthNavLabel = document.getElementById('monthNavLabel');
    const monthDays = document.getElementById('monthDays');
    const prevMonthBtn = document.getElementById('prevMonth');
    const nextMonthBtn = document.getElementById('nextMonth');

    const addAptBtn = document.getElementById('addAptBtn');
    const addAppointOverlay = document.getElementById('addAppoint');
    const addCancelBtn = document.getElementById('addCancelBtn');
    const saveAptBtn = document.getElementById('saveAptBtn');

    const aptDateInput = document.getElementById('aptDate');
    const aptTimeInput = document.getElementById('aptTime');
    const aptReasonInput = document.getElementById('aptReason');
    const aptHospitalSelect = document.getElementById('aptHospital');
    const aptDoctorSelect = document.getElementById('aptDoctor');
    const aptPatientInput = document.getElementById('aptPatient');

    const detailsAppointOverlay = document.getElementById('detailsAppoint');
    const detailsCloseBtn = document.getElementById('detailsCloseBtn');
    const detailsTitle = document.getElementById('detailsTitle');
    const dDate = document.getElementById('dDate');
    const dTime = document.getElementById('dTime');
    const dReason = document.getElementById('dReason');
    const dPatient = document.getElementById('dPatient');
    const dDoctor = document.getElementById('dDoctor');
    const dHospital = document.getElementById('dHospital');

    // - - - - - - - - - - - DATE - MONTH - YEAR - - - - - - - - - - -

    const today = new Date();
    let monthDate = new Date(today);

    const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

    // - - - - - - - - - - - SAMPLE DATA - - - - - - - - - - -
    const appointments = [
        { date: getDateOffset(0), time: '09:00', reason: 'Annual checkup',    patient: '784-1993-4821736-0', doctor: 'Dr. Patel - General Practice',     hospital: 'Dubai Hospital' },
        { date: getDateOffset(1), time: '11:30', reason: 'Follow-up visit',   patient: '784-1982-2871336-0', doctor: 'Dr. Hassan - Neurology',            hospital: 'Rashid Hospital' },
        { date: getDateOffset(3), time: '14:00', reason: 'Blood test',        patient: '784-2001-7739482-0', doctor: 'Dr. Al Mansoori - Cardiology',      hospital: 'American Hospital Dubai' },
        { date: getDateOffset(7), time: '08:30', reason: 'Skin consultation', patient: '784-1987-3056214-1', doctor: 'Dr. Nguyen - Dermatology',          hospital: 'Mediclinic City Hospital' }
    ];

    // - - - - - - - - - - - HELPER FUNCTIONS - - - - - - - - - - -

    // Get a date string offset by the given number of days from today
    function getDateOffset(offset = 0) {
        const date = new Date(today);
        date.setDate(date.getDate() + offset);
        return date.toISOString().slice(0, 10);
    }

    // Convert 24-hour time to 12-hour format with AM/PM
    function formatTime(time) {
        let [hours, minutes] = time.split(':').map(Number);
        const period = hours >= 12 ? 'PM' : 'AM';
        hours = hours % 12 || 12;
        return `${hours}:${String(minutes).padStart(2, '0')} ${period}`;
    }

    // Show or hide appointment overlay modals
    function toggleOverlay(overlayElement, shouldOpen) {
        overlayElement.classList.toggle('open', shouldOpen);
    }

    // - - - - - - - - - - - CALENDAR RENDERING - - - - - - - - - - -

    function buildMonthView() {
        // Update the month/year label in the header
        monthNavLabel.textContent = MONTHS[monthDate.getMonth()] + ' ' + monthDate.getFullYear();

        // Calculate calendar grid parameters
        const firstDayOfMonth = new Date(monthDate.getFullYear(), monthDate.getMonth(), 1);
        const lastDayOfMonth = new Date(monthDate.getFullYear(), monthDate.getMonth() + 1, 0).getDate();
        const startPadding = firstDayOfMonth.getDay();

        // Clear existing calendar cells
        monthDays.innerHTML = '';

        // Build a 6-week grid (42 cells total)
        const totalCells = 42;
        for (let i = 0; i < totalCells; i++) {
            const dayOffset = i - startPadding;
            const currentDate = new Date(monthDate.getFullYear(), monthDate.getMonth(), 1 + dayOffset);
            const dateString = currentDate.toISOString().slice(0, 10);
            const isOtherMonth = dayOffset < 0 || dayOffset >= lastDayOfMonth;

            // Create the calendar cell
            const cell = document.createElement('div');
            cell.className = 'month-cell'
                + (isOtherMonth ? ' other-month' : '')
                + (currentDate.toDateString() === today.toDateString() ? ' today' : '');

            // Add the day number
            const dayNumber = document.createElement('div');
            dayNumber.className = 'month-cell-num';
            dayNumber.textContent = currentDate.getDate();
            cell.appendChild(dayNumber);

            // Add appointment pills for this day
            appointments.filter(apt => apt.date === dateString).forEach(apt => {
                const pill = document.createElement('div');
                pill.className = 'month-apt';
                pill.innerHTML = `<span class="month-apt-reason">${apt.reason}</span>
                                  <span class="month-apt-time">${formatTime(apt.time)} · ${apt.hospital}</span>`;
                pill.addEventListener('click', e => {
                    e.stopPropagation();
                    showAppointmentDetails(apt);
                });
                cell.appendChild(pill);
            });

            // Clicking an empty cell opens the add form
            cell.addEventListener('click', () => openAddForm(dateString));
            monthDays.appendChild(cell);
        }
    }

    // - - - - - - - - - - - APPOINTMENT FORMS - - - - - - - - - - -

    function openAddForm(selectedDate = '') {
        // Clear all form fields
        aptDateInput.value = '';
        aptTimeInput.value = '';
        aptReasonInput.value = '';
        aptPatientInput.value = '';
        aptHospitalSelect.value = '';
        aptDoctorSelect.value = '';

        // Pre-fill the date if provided
        aptDateInput.value = selectedDate;

        // Show the add appointment modal
        toggleOverlay(addAppointOverlay, true);
    }

    function saveNewAppointment() {
        // Collect all form values
        const newAppointment = {
            date: aptDateInput.value.trim(),
            time: aptTimeInput.value.trim(),
            reason: aptReasonInput.value.trim(),
            hospital: aptHospitalSelect.value.trim(),
            doctor: aptDoctorSelect.value.trim(),
            patient: aptPatientInput.value.trim()
        };

        // Validate that all fields are filled
        const allFieldsFilled = Object.values(newAppointment).every(val => val !== '');
        if (!allFieldsFilled) {
            alert('Please fill in all fields.');
            return;
        }

        // Add to appointments array and refresh calendar
        appointments.push(newAppointment);
        toggleOverlay(addAppointOverlay, false);
        buildMonthView();
    }

    function showAppointmentDetails(appointment) {
        // Format the date nicely
        const formattedDate = new Date(appointment.date).toLocaleDateString('en-GB', {
            weekday: 'long',
            day: 'numeric',
            month: 'long',
            year: 'numeric'
        });

        // Populate the details modal
        detailsTitle.textContent = appointment.reason;
        dDate.textContent = formattedDate;
        dTime.textContent = formatTime(appointment.time);
        dReason.textContent = appointment.reason;
        dPatient.textContent = appointment.patient;
        dDoctor.textContent = appointment.doctor;
        dHospital.textContent = appointment.hospital;

        // Show the details modal
        toggleOverlay(detailsAppointOverlay, true);
    }

    // - - - - - - - - - - - EVENT LISTENERS - - - - - - - - - - -
    // User profile dropdown toggle
    userProfile.addEventListener('click', e => {
        e.stopPropagation();
        userProfile.classList.toggle('open');
        userDropdown.classList.toggle('open');
    });

    // Close dropdown when clicking anywhere else
    document.addEventListener('click', () => {
        userProfile.classList.remove('open');
        userDropdown.classList.remove('open');
    });

    // Logout button
    logoutBtn.addEventListener('click', () => {
        window.location.href = 'index.html';
    });

    // Month navigation buttons
    prevMonthBtn.addEventListener('click', () => {
        monthDate.setMonth(monthDate.getMonth() - 1);
        buildMonthView();
    });

    nextMonthBtn.addEventListener('click', () => {
        monthDate.setMonth(monthDate.getMonth() + 1);
        buildMonthView();
    });

    // Add appointment button (top toolbar)
    addAptBtn.addEventListener('click', () => {
        openAddForm(getDateOffset(0));
    });

    // Add appointment modal controls
    addCancelBtn.addEventListener('click', () => {
        toggleOverlay(addAppointOverlay, false);
    });

    addAppointOverlay.addEventListener('click', e => {
        if (e.target.id === 'addAppoint') {
            toggleOverlay(addAppointOverlay, false);
        }
    });

    saveAptBtn.addEventListener('click', saveNewAppointment);

    // - - - - - - - - - - - CONTROLS - - - - - - - - - - -
    detailsCloseBtn.addEventListener('click', () => {
        toggleOverlay(detailsAppointOverlay, false);
    });

    detailsAppointOverlay.addEventListener('click', e => {
        if (e.target.id === 'detailsAppoint') {
            toggleOverlay(detailsAppointOverlay, false);
        }
    });

    // Auto-format Emirates ID as user types (784-YYYY-XXXXXXX-X)
    aptPatientInput.addEventListener('input', function() {
        const digitsOnly = this.value.replace(/\D/g, '').slice(0, 15);
        const parts = [
            digitsOnly.slice(0, 3),
            digitsOnly.slice(3, 7),
            digitsOnly.slice(7, 14),
            digitsOnly.slice(14, 15)
        ];
        this.value = parts.filter(part => part.length).join('-');
    });

    buildMonthView();
</script>
</body>
</html>
