<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insurance</title>
    <link rel="stylesheet" href="styles.css">

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>

</head>
<body>

<div class="app-shell">

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-logo">
            <a href="index.html" class="logo-link">
                <img src="medPro_logo1.png" alt="MedPRO Logo" class="logo-icon"/>
                <span class="sidebar-logo-text">MedPRO</span>
            </a>
        </div>

        <nav class="sidebar-nav">
            <a href="index.html" class="nav-item">DASHBOARD</a>
            <a href="insurance.html" class="nav-item active">INSURANCE</a>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="main-content">

        <h1 class="page-title">Insurance</h1>

        <div class="reports-container">

            <div class="reports-header">
                <h2>Manage Insurance</h2>
            </div>

            <!-- FORM -->
            <input type="hidden" id="insuranceID">

            <input type="text" id="insuranceName" placeholder="Insurance Name">

            <br><br>

            <button onclick="addInsurance()">Add</button>
            <button onclick="updateInsurance()">Update</button>
            <button onclick="clearForm()">Clear</button>

            <br><br>

            <!-- SEARCH -->
            <input type="text" id="searchName" placeholder="Search...">
            <button onclick="searchInsurance()">Search</button>
            <button onclick="loadAllInsurance()">View All</button>

            <br><br>

            <!-- TABLE -->
            <table class="data-table">
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Edit</th>
                    <th>Delete</th>
                </tr>
                <tbody id="insuranceTableBody"></tbody>
            </table>

        </div>

    </main>

</div>

<!-- JS -->
<script>

    // run when page loads
    $(document).ready(function () {
        loadAllInsurance(); // load all data automatically
    });

    // get all insurance records from backend
    function loadAllInsurance() {
        $.ajax({
            url: "/api/insurance",
            type: "GET",
            success: function (data) {
                displayInsurance(data); // show data in table
            }
        });
    }

    // add new insurance
    function addInsurance() {
        let insuranceName = $("#insuranceName").val(); // get input value

        let obj = {
            insuranceName: insuranceName // create object to send
        };

        $.ajax({
            url: "/api/insurance",
            type: "POST",
            contentType: "application/json",
            data: JSON.stringify(obj), // convert to JSON
            success: function () {
                loadAllInsurance(); // refresh table
                clearForm(); // clear input
            }
        });
    }

    // search insurance by name
    function searchInsurance() {
        let name = $("#searchName").val(); // get search input

        $.ajax({
            url: "/api/insurance/search?insuranceName=" + name, // search API
            type: "GET",
            success: function (response) {
                displayInsurance(response); // show results
            }
        });
    }

    // update insurance name using ID
    function updateInsurance() {
        let id = $("#insuranceID").val(); // get selected ID
        let name = $("#insuranceName").val(); // get new name

        let obj = {
            insuranceName: name
        };

        $.ajax({
            url: "/api/insurance/" + id,
            type: "PUT",
            contentType: "application/json",
            data: JSON.stringify(obj),
            success: function () {
                loadAllInsurance(); // refresh table
                clearForm(); // clear input
            }
        });
    }

    // delete insurance by ID
    function deleteInsurance(id) {
        $.ajax({
            url: "/api/insurance/" + id,
            type: "DELETE",
            success: function () {
                loadAllInsurance(); // refresh table
            }
        });
    }

    // fill form when user clicks edit
    function editInsurance(id, name) {
        $("#insuranceID").val(id);
        $("#insuranceName").val(name);
    }

    // display data in table
    function displayInsurance(response) {
        let rows = "";

        $.each(response, function (key, value) {
            rows += `
            <tr>
                <td>${value.insuranceID}</td>
                <td>${value.insuranceName}</td>
                <td>
                    <button onclick="editInsurance(${value.insuranceID}, '${value.insuranceName}')">
                        Edit
                    </button>
                </td>
                <td>
                    <button onclick="deleteInsurance(${value.insuranceID})">
                        Delete
                    </button>
                </td>
            </tr>
        `;
        });

        $("#insuranceTableBody").html(rows); // update table
    }

    // clear input fields
    function clearForm() {
        $("#insuranceID").val("");
        $("#insuranceName").val("");
    }

</script>

</body>
</html>
